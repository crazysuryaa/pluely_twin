name: Validate Twin Commenter

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/validate-twin.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libgtk-3-dev \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Pluely frontend
        run: |
          npm ci
          npm run build

      - name: Cargo check Pluely host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Twin Commenter frontend
        working-directory: commenter
        run: |
          npm install
          npm run build

      - name: Persist Cargo.lock update
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: update Cargo.lock for Twin Commenter"
          git push origin develop
